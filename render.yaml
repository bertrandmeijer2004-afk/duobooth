# Blueprint Render: New -> Blueprint -> pilih repositori ini.
services:
  - type: web
    name: duobooth
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      # Opsional, supaya video lancar di data seluler / WiFi kantor (isi lewat dashboard):
      # - key: TURN_URL
      #   sync: false
      # - key: TURN_USERNAME
      #   sync: false
      # - key: TURN_CREDENTIAL
      #   sync: false
